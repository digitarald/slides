<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Passion Project — Games, Code & AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating pixel particles -->
    <canvas id="particles"></canvas>

    <!-- XP progress bar -->
    <div class="progress-indicator" id="progress"></div>

    <!-- Navigation dots -->
    <nav class="nav-dots" id="navDots"></nav>

    <!-- Slide counter -->
    <div class="slide-counter">
        <span class="current" id="currentSlide">01</span>
        <span>/</span>
        <span id="totalSlides">00</span>
    </div>

    <!-- Slides Container -->
    <main id="slides-container"></main>

    <script>
        const slideFiles = [
            'slides/01-title.html',
            'slides/02-clonk-video.html',
            'slides/02-clonk.html',
            'slides/03-clonk-minecraft.html',
            'slides/04-halflife.html',
            'slides/05-level-editor.html',
            'slides/06-superpower.html',
            'slides/07-books.html',
            'slides/08-ai-pivot.html',
            'slides/09-demo-pre.html',
            'slides/10-demo-live.html',
            'slides/11-close.html',
        ];

        async function loadSlides() {
            const container = document.getElementById('slides-container');

            const slidePromises = slideFiles.map(file =>
                fetch(file).then(response => {
                    if (!response.ok) throw new Error(`Failed to load ${file}`);
                    return response.text();
                })
            );

            try {
                const slideContents = await Promise.all(slidePromises);
                container.innerHTML = slideContents.join('\n');
                document.getElementById('totalSlides').textContent =
                    String(slideFiles.length).padStart(2, '0');
                initPresentation();
            } catch (error) {
                console.error('Error loading slides:', error);
                container.innerHTML = `
                    <section class="slide">
                        <div class="slide-content" style="text-align:center">
                            <h2>Error Loading Slides</h2>
                            <p style="color: var(--pixel-red);">${error.message}</p>
                            <p style="margin-top: 1rem;">
                                Run <code>npx serve</code> or <code>python -m http.server</code> in this folder.
                            </p>
                        </div>
                    </section>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadSlides);
    </script>

    <script src="presentation.js"></script>
</body>
</html>
