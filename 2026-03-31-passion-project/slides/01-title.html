<!-- 01 — TITLE: Game-like entrance with bouncing title -->
<section class="slide slide-title">
    <div class="slide-content" style="text-align: center;">

        <div class="badge badge-green reveal" style="transition-delay: 0s;">
            PASSION PROJECT
        </div>

        <h1 class="reveal" style="transition-delay: 0.2s; margin-bottom: 1rem;">
            I've been coding since I was
            <span class="text-green glow sparkle">your age</span>
        </h1>

        <p class="reveal" style="transition-delay: 0.4s; font-size: clamp(1.3rem, 3vw, 2rem); color: var(--text-secondary); margin-bottom: 2rem;">
            …and it's all because of a <span class="text-orange sparkle">video game</span>.
        </p>

        <div class="reveal" style="transition-delay: 0.8s;">
            <span class="bounce-arrow">▼</span>
        </div>
    </div>
</section>
