<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP speaker notes</title>
  <style>
    :root { color-scheme:dark; }
    body { background:#101b2c; color:#edf1f5; font:25px/1.55 system-ui,sans-serif; padding:30px; margin:0; }
    h1 { font:15px/1.5 monospace; color:#86dbde; margin:0 0 30px; }
    ul { padding-left:25px; margin:0; }li { padding-left:6px; margin-bottom:24px; }
    .primary-takeaway { color:#f7d69c; font-size:28px; line-height:1.4; padding-bottom:24px; border-bottom:1px solid #40556c; margin-bottom:28px; }
    #connection { color:#f7cd8c; font-size:16px; }
  </style>
  <script src="deck-content.js" defer></script>
  <script src="notes.js" defer></script>
</head>
<body>
  <h1 id="notes-title">Speaker notes</h1>
  <p id="connection" role="status">Connecting to the presentation…</p>
  <ul id="notes-list"></ul>
</body>
</html>
